name: test

# どのブランチの push でも、Windows のランナーでテストを走らせる。画面を覆うテスト、
# モンキーテスト、E2E は利用者の PC の画面とマウスを奪うので、手元ではなくここで走らせる。
# release.yml からも呼び、タグのコミットがこのテストを通ってから公開する。
# 二重に走らないよう、タグの push は除き（release.yml が呼ぶ）、pull_request は付けない（ブランチの push が走る）。
# タグを除くには branches を書く。tags-ignore だけを書くと、ブランチの push でも走らなくなる。
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 同じ ref で新しい実行が始まったら、古い実行は止める。長い画面のテストが重ならない。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 画面のテストは、ランナーの版で結果が変わりやすい。版が勝手に替わらないよう固定する。
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # cargo install の結果（~/.cargo/bin）も、ここで一緒に保存される。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      - name: Install cargo-audit
        shell: pwsh
        run: cargo install cargo-audit --locked
      - name: Validate
        shell: pwsh
        run: scripts/validate.ps1
      - name: Lint the workflows
        shell: pwsh
        run: scripts/check-workflows.ps1 -Strict

  # 画面のテストは 4 つのジョブに分け、並べて走らせる。窓の撮影（Windows Graphics Capture）、録画、動画、
  # ランダム操作は capture に、ほかは screen に分け、窓の撮影の失敗に邪魔されず、ほかが通るか見えるようにする。失敗したジョブの出力と、そのときの
  # デスクトップの画像は、成果物（<名前>-logs）として持ち帰る。
  screen:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      # リークのテストはプロセス全体の GDI と USER のオブジェクトを数えるので、ほかと分けて走らせる。
      - name: Run the tests that cover the screen
        shell: pwsh
        timeout-minutes: 60
        run: scripts/ci-cargo-test.ps1 -Log screen -TestArguments '--bin','snippinglite','--','--ignored','--test-threads=1','--skip','leaks','--skip','window_capture::','--skip','record::','--skip','video::','--skip','monkey::','--skip','markup::tests::modes::a_window_','--skip','overlay::display::tests::recording::a_window_','--skip','overlay::tests::a_window_under','--skip','screenshot::tests::a_window_','--skip','screenshot::tests::a_picked_window'
      - name: Take a screenshot of the desktop
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: scripts/ci-screenshot.ps1 -Name screen
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: screen-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # 窓の撮影（Windows Graphics Capture）は、CI の Windows Server 2025 では、拡張スタイルのない普通の窓しか
  # 受け付けない（WS_EX_TOOLWINDOW も WS_EX_NOACTIVATE も E_INVALIDARG で拒まれた）。次の 13 件は、窓の
  # 撮影が拒まれたか、時間がかかって失敗したので、ここでは走らせず、capture-excluded（手動）に移した。
  # 直ったか確かめるには、Actions の画面から Run workflow で test を走らせる。通ったら、ここの --skip から外す。
  capture:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      - name: Run the tests that capture windows and record
        shell: pwsh
        timeout-minutes: 60
        run: scripts/ci-cargo-test.ps1 -Log capture -TestArguments '--bin','snippinglite','--','--ignored','--test-threads=1','window_capture::','record::','video::','monkey::','markup::tests::modes::a_window_','overlay::display::tests::recording::a_window_','overlay::tests::a_window_under','screenshot::tests::a_window_','screenshot::tests::a_picked_window','--skip','markup::tests::modes::a_window_hanging_off_the_left_of_the_screen_is_marked_up_where_it_is','--skip','markup::tests::modes::a_window_snip_is_marked_up_over_the_window_alone','--skip','monkey::random_input_keeps_the_tray_and_its_windows_consistent','--skip','overlay::display::tests::recording::a_window_countdown_and_recording_follow_the_window_through_a_new_layout','--skip','record::tests::flows::closing_the_recorded_window_keeps_what_was_recorded','--skip','record::tests::records_covered_window_without_other_windows','--skip','screenshot::tests::a_picked_window_is_captured_by_itself','--skip','video::flows::a_window_that_goes_away_ends_the_recording_with_a_warning','--skip','window_capture::tests::capture_follows_a_window_that_is_resized','--skip','window_capture::tests::capture_ignores_occluding_windows_and_keeps_updating','--skip','window_capture::tests::capture_keeps_only_the_newest_of_several_waiting_frames','--skip','window_capture::tests::capture_stops_when_its_window_goes_away_or_is_minimized','--skip','window_capture::tests::ending::closing_the_window_tells_the_capture_that_it_ended'
      - name: Take a screenshot of the desktop
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: scripts/ci-screenshot.ps1 -Name capture
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: capture-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  capture-excluded:
    # 手動の実行（workflow_dispatch）でだけ走る。push では走らせない。
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      - name: Run the excluded tests
        shell: pwsh
        timeout-minutes: 60
        run: scripts/ci-cargo-test.ps1 -Log excluded -TestArguments '--bin','snippinglite','--','--ignored','--test-threads=1','markup::tests::modes::a_window_hanging_off_the_left_of_the_screen_is_marked_up_where_it_is','markup::tests::modes::a_window_snip_is_marked_up_over_the_window_alone','monkey::random_input_keeps_the_tray_and_its_windows_consistent','overlay::display::tests::recording::a_window_countdown_and_recording_follow_the_window_through_a_new_layout','record::tests::flows::closing_the_recorded_window_keeps_what_was_recorded','record::tests::records_covered_window_without_other_windows','screenshot::tests::a_picked_window_is_captured_by_itself','video::flows::a_window_that_goes_away_ends_the_recording_with_a_warning','window_capture::tests::capture_follows_a_window_that_is_resized','window_capture::tests::capture_ignores_occluding_windows_and_keeps_updating','window_capture::tests::capture_keeps_only_the_newest_of_several_waiting_frames','window_capture::tests::capture_stops_when_its_window_goes_away_or_is_minimized','window_capture::tests::ending::closing_the_window_tells_the_capture_that_it_ended'
      - name: Take a screenshot of the desktop
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: scripts/ci-screenshot.ps1 -Name excluded
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: excluded-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  leaks:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      - name: Run the leak tests
        shell: pwsh
        run: scripts/ci-cargo-test.ps1 -Log leaks -TestArguments '--bin','snippinglite','--','leaks','--ignored','--test-threads=1'
      - name: Take a screenshot of the desktop
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: scripts/ci-screenshot.ps1 -Name leaks
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: leaks-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      # ランナーには GPU がなく OpenGL 2.0 がないので、履歴などの窓のために Mesa のソフトウェア描画を入れる。
      - name: Install a software OpenGL
        shell: pwsh
        run: scripts/ci-install-mesa.ps1
      - name: Run the end-to-end tests
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: scripts/ci-cargo-test.ps1 -Log e2e -TestArguments '--test','e2e','--','--ignored','--test-threads=1'
      - name: Take a screenshot of the desktop
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: scripts/ci-screenshot.ps1 -Name e2e
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore
