name: release

# v0.1.0 のようなタグを push すると、まずタグとバージョンの一致を確かめ、次に test.yml のテストをすべて
# 通し、そのあとで artifacts/ のファイルを GitHub のリリースとして公開する。テストが 1 つでも
# 落ちれば、リリースは作られない（タグだけが残るので、直して、タグを付け直す）。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version $version." }

  test:
    needs: version
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: windows
      - name: Build and collect the release files
        shell: pwsh
        run: scripts/publish.ps1
      - name: Smoke test the release executable
        shell: pwsh
        run: scripts/smoke.ps1 -Exe artifacts/snippinglite.exe
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts -File).FullName --title $env:GITHUB_REF_NAME --generate-notes
