# ワークフローが使うアクションと、Rust の依存関係の更新を、週に 1 度、pull request で知らせる。
# 依存関係の更新を取り込むときは、cargo audit と scripts/update-notices.ps1 も実行する。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # windows、windows-core、windows-sys は、バージョンをそろえて手で上げる（0.x の更新は
    # 互換がなく、型が合わなくなる）。Dependabot が 1 つずつ上げようとして失敗するので外す。
    # 脆弱性の修正の更新は、この設定に関係なく届く。
    ignore:
      - dependency-name: windows
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: windows-core
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: windows-sys
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
